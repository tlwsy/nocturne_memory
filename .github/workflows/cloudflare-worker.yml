name: Cloudflare Worker

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: cloudflare-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            cloudflare/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Cloudflare dependencies
        run: npm ci
        working-directory: cloudflare
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Generate Worker types
        run: npm run cf-typegen
        working-directory: cloudflare
      - name: Apply local D1 migrations
        run: npm run migrate:local
        working-directory: cloudflare
      - name: Typecheck and tests
        run: npm run typecheck && npm test
        working-directory: cloudflare

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            cloudflare/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: cloudflare
      - run: npm run build
        working-directory: frontend
      - name: Apply remote D1 migrations
        run: npm run migrate:remote
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx wrangler deploy
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Health smoke test
        run: curl --fail --silent --show-error "${{ vars.CLOUDFLARE_WORKER_URL }}/health"
      - name: MCP initialize smoke test
        run: |
          curl --fail --silent --show-error "${{ vars.CLOUDFLARE_WORKER_URL }}/mcp" \
            -H "Authorization: Bearer ${{ secrets.NOCTURNE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"github-actions","version":"1.0.0"}}}'
